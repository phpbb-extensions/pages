imports:
    - { resource: tables.yml }

services:
    # Keep phpBB's canonical text formatter services as the autowiring targets.
    # Pages registers isolated instances of these classes for LiteDown support.
    phpbb\textformatter\s9e\factory:
        alias: text_formatter.s9e.factory

    phpbb\textformatter\s9e\parser:
        alias: text_formatter.s9e.parser

    phpbb\textformatter\s9e\renderer:
        alias: text_formatter.s9e.renderer

    phpbb\textformatter\cache_interface:
        alias: text_formatter.cache

    phpbb\textformatter\parser_interface:
        alias: text_formatter.parser

    phpbb\textformatter\renderer_interface:
        alias: text_formatter.renderer

    phpbb.pages.admin.controller:
        class: phpbb\pages\controller\admin_controller
        arguments:
            - '@cache.driver'
            - '@phpbb.pages.routing.route_cache'
            - '@controller.helper'
            - '@language'
            - '@log'
            - '@phpbb.pages.operator'
            - '@request'
            - '@template'
            - '@user'
            - '@service_container'
            - '@dispatcher'
            - '%core.root_path%'
            - '%core.php_ext%'

    phpbb.pages.routing.route_cache:
        class: phpbb\pages\routing\route_cache
        arguments:
            - '@filesystem'
            - '%core.cache_dir%'
            - '%core.php_ext%'

    phpbb.pages.controller:
        class: phpbb\pages\controller\main_controller
        arguments:
            - '@auth'
            - '@service_container'
            - '@controller.helper'
            - '@language'
            - '@template'
            - '@user'

    phpbb.pages.listener:
        class: phpbb\pages\event\listener
        arguments:
            - '@auth'
            - '@controller.helper'
            - '@language'
            - '@phpbb.pages.operator'
            - '@router'
            - '@template'
            - '@user'
            - '%core.php_ext%'
        tags:
            - { name: event.listener }

    phpbb.pages.text_formatter.litedown:
        class: phpbb\pages\textformatter\litedown
        arguments:
            - '@service_container'
            - '@config'

    phpbb.pages.text_formatter.factory:
        class: phpbb\pages\textformatter\factory
        arguments:
            - '@text_formatter.data_access'
            - '@cache.driver'
            - '@dispatcher'
            - '@config'
            - '@text_formatter.s9e.link_helper'
            - '@log'
            - '%text_formatter.cache.dir%'
            - '_phpbb_pages_text_formatter_parser'
            - '_phpbb_pages_text_formatter_renderer'

    phpbb.pages.text_formatter.parser:
        class: phpbb\textformatter\s9e\parser
        arguments:
            - '@cache.driver'
            - '_phpbb_pages_text_formatter_parser'
            - '@phpbb.pages.text_formatter.factory'
            - '@dispatcher'

    phpbb.pages.text_formatter.renderer:
        class: phpbb\textformatter\s9e\renderer
        arguments:
            - '@cache.driver'
            - '%text_formatter.cache.dir%'
            - '_phpbb_pages_text_formatter_renderer'
            - '@phpbb.pages.text_formatter.factory'
            - '@dispatcher'
        calls:
            - [configure_quote_helper, ['@text_formatter.s9e.quote_helper']]
            - [configure_smilies_path, ['@config', '@path_helper']]
            - [configure_user, ['@user', '@config', '@auth']]

    phpbb.pages.entity:
        class: phpbb\pages\entity\page
        shared: false # service MUST not be shared for this to work!
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@dispatcher'
            - '%phpbb.pages.tables.pages%'
            - '@text_formatter.utils'
            - '@phpbb.pages.text_formatter.litedown'

    phpbb.pages.operator:
        class: phpbb\pages\operators\page
        arguments:
            - '@cache.driver'
            - '@service_container'
            - '@dbal.conn'
            - '@ext.manager'
            - '@user'
            - '%phpbb.pages.tables.pages%'
            - '%phpbb.pages.tables.pages_links%'
            - '%phpbb.pages.tables.pages_pages_links%'

    phpbb.pages.routing.loader:
        class: phpbb\pages\routing\page_loader
        arguments:
            - '@dbal.conn'
            - '%phpbb.pages.tables.pages%'
        tags:
            - { name: routing.loader }

    phpbb.pages.text_reparser.page_text:
        class: phpbb\pages\textreparser\plugins\pages_text
        arguments:
            - '@dbal.conn'
            - '%phpbb.pages.tables.pages%'
            - '@phpbb.pages.text_formatter.litedown'
        calls:
            - [set_name, [phpbb_pages_text]]
        tags:
            - { name: text_reparser.plugin }

    phpbb.pages.cron.task.text_reparser.factory:
        class: phpbb\pages\textreparser\cron_text_reparser_factory

    phpbb.pages.cron.task.text_reparser:
        class: phpbb\cron\task\text_reparser\reparser
        factory: ['@phpbb.pages.cron.task.text_reparser.factory', 'create']
        arguments:
            - '@service_container'
        tags:
            - { name: cron.task }
